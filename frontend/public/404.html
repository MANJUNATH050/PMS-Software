<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PMS Performance Management System</title>
  <script>
    // SPA Fallback redirect for static web servers
    (function() {
      var path = window.location.pathname + window.location.search + window.location.hash;
      sessionStorage.setItem('spa_redirect_path', path);
      window.location.replace('/index.html');
    })();
  </script>
</head>
<body>
  <p>Loading PMS Application...</p>
</body>
</html>
