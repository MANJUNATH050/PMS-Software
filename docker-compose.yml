services:

  postgres:
    image: postgres:15-alpine
    container_name: pms_postgres

    environment:
      - POSTGRES_DB=pms_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres

    ports:
      - "5433:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d pms_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: pms_backend

    ports:
      - "8080:8080"

    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=pms_db
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - ./reports:/app/reports

  frontend:
    build: ./frontend
    container_name: pms_frontend

    ports:
      - "80:80"

    depends_on:
      - backend

volumes:
  pgdata:
